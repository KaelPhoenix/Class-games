<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>课堂游戏：生词打地鼠</title>
<style>
    body {
        font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        background-color: #ffeaa7;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        margin: 0;
        user-select: none;
        overflow: hidden;
    }
    
    /* 顶部信息栏 */
    .header {
        background-color: #fab1a0;
        width: 100%;
        padding: 15px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-size: 1.5em;
        font-weight: bold;
        color: #d63031;
    }

    /* 目标单词显示区 */
    .target-box {
        background-color: white;
        padding: 10px 30px;
        border-radius: 50px;
        border: 4px solid #d63031;
        min-width: 300px;
        text-align: center;
    }
    .target-ar { font-family: 'Amiri', serif; font-size: 1.4em; color: #2d3436; }
    .target-en { font-size: 0.8em; color: #636e72; }

    /* 游戏网格 */
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 30px;
        width: 600px;
        height: 500px;
    }

    .hole {
        background-color: #b2bec3;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        border-bottom: 8px solid #636e72;
        box-shadow: inset 0 10px 20px rgba(0,0,0,0.2);
    }

    /* 地鼠（卡片） */
    .mole {
        position: absolute;
        top: 100%; /* 默认藏在下面 */
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #74b9ff, #0984e3);
        border-radius: 50%; /* 圆形 */
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 3em;
        font-weight: bold;
        transition: top 0.4s;
        cursor: pointer;
        border: 4px solid white;
        box-sizing: border-box;
    }

    .mole.up {
        top: 10%; /* 冒出来的位置 */
    }

    /* 点击反馈 */
    .mole:active {
        transform: scale(0.95);
    }
    
    .score-board {
        font-size: 1.2em;
        color: #2d3436;
    }

    .controls {
        margin-top: 20px;
    }

    .btn {
        padding: 15px 40px;
        font-size: 1.5em;
        background-color: #00b894;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 5px 0 #008f72;
        transition: all 0.1s;
    }
    .btn:active {
        box-shadow: 0 2px 0 #008f72;
        transform: translateY(3px);
    }

</style>
</head>
<body>

<div class="header">
    <div class="score-board">分数 (Score): <span id="score">0</span></div>
    <div class="target-box" id="targetBox">
        <div>准备好了吗？</div>
        <div class="target-en">Ready?</div>
    </div>
    <div class="score-board">倒计时 (Time): <span id="time">30</span></div>
</div>

<div class="grid">
    <div class="hole"><div class="mole" id="mole0" onclick="whack(0)"></div></div>
    <div class="hole"><div class="mole" id="mole1" onclick="whack(1)"></div></div>
    <div class="hole"><div class="mole" id="mole2" onclick="whack(2)"></div></div>
    <div class="hole"><div class="mole" id="mole3" onclick="whack(3)"></div></div>
    <div class="hole"><div class="mole" id="mole4" onclick="whack(4)"></div></div>
    <div class="hole"><div class="mole" id="mole5" onclick="whack(5)"></div></div>
    <div class="hole"><div class="mole" id="mole6" onclick="whack(6)"></div></div>
    <div class="hole"><div class="mole" id="mole7" onclick="whack(7)"></div></div>
    <div class="hole"><div class="mole" id="mole8" onclick="whack(8)"></div></div>
</div>

<div class="controls">
    <button class="btn" onclick="startGame()">开始游戏 (Start)</button>
</div>

<script>
    // 词库
    const words = [
        {zh: "试shì", ar: "يُجَرِّب", en: "Try"},
        {zh: "件jiàn", ar: "قِطْعَة", en: "Piece"},
        {zh: "衣服yīfu", ar: "مَلابِس", en: "Clothes"},
        {zh: "短duǎn", ar: "قَصِير", en: "Short"},
        {zh: "长chǎng", ar: "طَوِيل", en: "Long"},
        {zh: "就jiù", ar: "إِذَنْ", en: "Then/Just"}
    ];

    let score = 0;
    let time = 30;
    let isPlaying = false;
    let timerId = null;
    let moleTimer = null;
    let currentTarget = null; // 当前要找的目标词
    let activeMole = null; // 当前冒出来的地鼠ID

    const holes = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time');
    const targetBox = document.getElementById('targetBox');

    function startGame() {
        if(isPlaying) return;
        score = 0;
        time = 30;
        scoreDisplay.textContent = 0;
        timeDisplay.textContent = 30;
        isPlaying = true;
        
        // 随机选一个目标词
        setNewTarget();

        // 倒计时
        timerId = setInterval(() => {
            time--;
            timeDisplay.textContent = time;
            if(time === 0) {
                gameOver();
            }
        }, 1000);

        // 地鼠冒出的循环
        popUp();
    }

    function setNewTarget() {
        // 随机选择一个目标
        const randomIndex = Math.floor(Math.random() * words.length);
        currentTarget = words[randomIndex];
        
        // 更新顶部显示 (显示阿语和英语)
        targetBox.innerHTML = `
            <div class="target-ar">${currentTarget.ar}</div>
            <div class="target-en">${currentTarget.en}</div>
        `;
    }

    function popUp() {
        if(!isPlaying) return;

        // 1. 随机选一个洞
        const randomHoleIndex = Math.floor(Math.random() * holes.length);
        const mole = holes[randomHoleIndex];
        
        // 2. 决定这个地鼠拿什么字
        // 60%的概率是正确答案，40%是干扰项
        let showWord;
        if(Math.random() > 0.4) {
            showWord = currentTarget.zh; // 正确答案
            mole.dataset.isCorrect = "true";
        } else {
            // 随机找一个错误的
            let wrongWord = words[Math.floor(Math.random() * words.length)];
            while(wrongWord.zh === currentTarget.zh) {
                wrongWord = words[Math.floor(Math.random() * words.length)];
            }
            showWord = wrongWord.zh;
            mole.dataset.isCorrect = "false";
        }

        mole.textContent = showWord;

        // 3. 冒出来
        mole.classList.add('up');

        // 4. 停留时间 (1.5秒后缩回去)
        setTimeout(() => {
            mole.classList.remove('up');
            if(isPlaying) {
                // 等待0.5秒后再冒下一个
                setTimeout(popUp, 500); 
            }
        }, 1500); 
    }

    function whack(index) {
        if(!isPlaying) return;
        const mole = document.getElementById('mole' + index);
        
        // 防止连点
        if(!mole.classList.contains('up')) return;

        if(mole.dataset.isCorrect === "true") {
            // 点对了！
            score += 10;
            mole.style.backgroundColor = "#00b894"; // 变绿
            mole.textContent = "√";
            setTimeout(() => mole.style.backgroundColor = "", 200); // 恢复颜色
            
            // 点对了就立刻换下一个目标，增加紧迫感
            setNewTarget();
        } else {
            // 点错了！
            score -= 5;
            mole.style.backgroundColor = "#d63031"; // 变红
            mole.textContent = "×";
            setTimeout(() => mole.style.backgroundColor = "", 200);
        }
        
        scoreDisplay.textContent = score;
        mole.classList.remove('up'); // 被打了就缩回去
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(timerId);
        targetBox.innerHTML = `<div>游戏结束!</div><div class="target-en">Score: ${score}</div>`;
        
        // 清除所有地鼠
        holes.forEach(hole => hole.classList.remove('up'));
    }

</script>

</body>
</html>
